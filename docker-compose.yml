services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: esg-oracle
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-OraclePass123}
    ports:
      - "1521:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 20s
      timeout: 5s
      retries: 40
      start_period: 180s

  api:
    build: .
    container_name: api-esg
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USER: SYSTEM
      DB_PASS: ${ORACLE_PASSWORD:-OraclePass123}
      SPRING_JPA_OPEN_IN_VIEW: "false"
    depends_on:
      oracle:
        condition: service_healthy